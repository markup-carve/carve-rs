[package]
name = "carve2-bench"
version = "0.0.0"
edition = "2024"
description = "Times the 0.2 engine against the 0.1 engine on the normal path, stage by stage."
license = "MIT"
publish = false

# Its own workspace: the 0.1 crate is a dependency here, so the lints of the
# 0.2 crate's CI must not reach it.
[workspace]

[dependencies]
carve2 = { path = "..", features = ["profile"] }
carve = { package = "carve-lang", path = "../.." }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
