[package]
name = "carve2"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Carve 0.2 engine, stage 1: parse, resolve and HTML from the 0.2 specification."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1.1"
unicode-normalization = "0.1"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "carve2"
path = "src/main.rs"
