name: Release notes check

on:
  pull_request:
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check-release-notes.py'
      - 'tools/test-release-notes.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-notes.yml'

permissions:
  contents: read

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check release-note comparison and rejection cases
        run: python3 tools/test-release-notes.py
