name: Changelog drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-drift-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  completeness:
    name: Pending changelog completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check merges since the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/check-changelog-completeness.py 2>&1 | tee /tmp/changelog-drift.txt && status=0 || status=$?
          {
            echo '## Changelog completeness'
            echo
            echo '```text'
            cat /tmp/changelog-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
