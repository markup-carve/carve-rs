name: Changelog drift

# A drift verdict (gate exit 3) files one tracking issue and the run stays
# GREEN: the issue is the channel (markup-carve/carve#2706). A gate that could
# not judge, or a reporter that could not file, keeps the run RED.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: changelog-drift-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  completeness:
    name: Pending changelog completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check merges since the last tag
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          FILES_A_TICKET: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -o pipefail
          python3 tools/check-changelog-completeness.py 2>&1 | tee /tmp/changelog-drift.txt && status=0 || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '## Changelog completeness'
            echo
            echo '```text'
            cat /tmp/changelog-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Off the default branch the reporter files nothing, so drift stays red there.
          if [ "$status" = 3 ] && [ "$FILES_A_TICKET" = true ]; then
            echo "Drift verdict: the reporter files it, and the run stays green."
            exit 0
          fi
          exit "$status"

      # A scheduled run reports into a page nobody is obliged to open, so the
      # verdict is filed as one ticket: opened by the first failing measurement,
      # edited by later ones, closed by the first clean one. Same reporter as
      # carve's changelog-drift.yml. It fails if it cannot file.
      - name: File the verdict where someone reads it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ steps.measure.outputs.status }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Changelog drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="The unreleased changelog section is behind the merges since the last tag"
          MARKER="<!-- changelog-drift-verdict ref=$REF_NAME -->"

          # Listed rather than searched: the search index lags a fresh issue by
          # enough to file a duplicate. Matched on the marker rather than the
          # title, so renaming the issue does not fork it into two.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if [ "${STATUS:-1}" = "0" ]; then
            echo "The unreleased section accounts for every merge on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Clean again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next failing measurement opens a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "\`check-changelog-completeness\` is failing against the Unreleased section of"
            echo "CHANGELOG.md. Nothing else asks this between a merge and a tag, so the"
            echo "alternative to this ticket is finding out on cut day."
            echo
            if [ "${STATUS:-1}" != "3" ]; then
              echo "**The gate could not judge** (exit \`${STATUS:-none}\`), so this run is red and"
              echo "the output below is a broken check, not a list of missing entries. Fix that first."
              echo
            fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### What it reported"
            echo
            echo '```text'
            cat /tmp/changelog-drift.txt
            echo '```'
            echo
            echo "### How to clear it"
            echo
            echo "Write the missing merges into the section being prepared, or exempt a"
            echo "merge no reader of the notes needs in \`.changelog-exempt\`. Reproduce"
            echo "locally with \`python3 tools/check-changelog-completeness.py\`."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later failing measurement and CLOSED by the first clean one. Closing it by"
            echo "hand does not silence it: the next failing measurement files a new one."
          } > /tmp/changelog-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/changelog-drift-verdict.md
            echo "Updated #$issue."
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --label chore --label area:tooling \
              --body-file /tmp/changelog-drift-verdict.md)"
            echo "Filed $url."
          fi
