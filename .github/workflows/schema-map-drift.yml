name: Schema map attribute drift

# ci.yml's schema-map job gates the map's DECISIONS on every pull request
# (tools/check-schema-map.py) and does not read node `attrs`, which is how the
# table cell attributes fell behind (markup-carve/carve-rs#4292). This compares
# the attrs with carve-grammars `main` daily and files one tracking issue, the
# way carve-php's schema-map-drift.yml does. A drift verdict files the ticket
# and the run stays green; a check that could not run is red.

on:
  schedule:
    # 05:45 UTC, after carve-php's run at 05:30.
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schema-map-drift-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  schema-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: ProseMirror schema map attributes match carve-grammars

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-grammars
          path: .carve-grammars

      - name: Compare the map's attributes with carve-grammars main
        id: measure
        run: |
          set -uo pipefail
          upstream_sha="$(git -C .carve-grammars rev-parse HEAD)"
          echo "upstream=$upstream_sha" >> "$GITHUB_OUTPUT"
          python3 tools/schema-map-attrs-drift.py resources/prosemirror-schema-map.json \
            .carve-grammars/tiptap/schema-map.json > /tmp/schema-map-drift.txt
          status=$?
          case "$status" in
            0) verdict=clean ;;
            1) verdict=drift; echo "::warning::node attributes differ from carve-grammars $upstream_sha" ;;
            *) echo "::error::schema-map-attrs-drift could not run (exit $status); no verdict to file."; exit 1 ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo '## Schema map attribute drift'
            echo
            echo "carve-grammars \`$upstream_sha\`: $verdict"
            echo
            echo '```text'
            cat /tmp/schema-map-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File the verdict where someone reads it
        if: ${{ !cancelled() && (steps.measure.outputs.verdict == 'clean' || steps.measure.outputs.verdict == 'drift') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.measure.outputs.verdict }}
          UPSTREAM: ${{ steps.measure.outputs.upstream }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Schema map drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="The vendored ProseMirror schema map's node attributes have drifted from carve-grammars"
          MARKER="<!-- schema-map-drift-verdict ref=$REF_NAME -->"

          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if [ "$VERDICT" = clean ]; then
            echo "The schema map attributes agree with carve-grammars $UPSTREAM."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Clean again: run $RUN_URL against carve-grammars \`$UPSTREAM\`. Closing. The next drift verdict opens a fresh ticket."
              gh issue close "$issue" --repo "$REPO"
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "The node attributes in \`resources/prosemirror-schema-map.json\` no longer match"
            echo "carve-grammars \`tiptap/schema-map.json\` at \`$UPSTREAM\`."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "### Types whose attributes differ"
            echo
            echo '```text'
            cat /tmp/schema-map-drift.txt
            echo '```'
            echo
            echo "### How to clear it"
            echo
            echo "Refresh \`resources/prosemirror-schema-map.json\` from carve-grammars (keep \`_provenance\`"
            echo "and its declared divergences, bump \`_provenance.commit\`), make the bridge in"
            echo "\`src/prosemirror/\` follow what moved, and run \`tools/check-schema-map.py\`."
            echo
            echo "This ticket is maintained by the workflow: each drift verdict edits it and"
            echo "the first clean run closes it."
          } > /tmp/schema-map-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/schema-map-drift-verdict.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label chore --label area:tooling \
              --body-file /tmp/schema-map-drift-verdict.md
          fi
