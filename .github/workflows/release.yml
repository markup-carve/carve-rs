name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for crates.io Trusted Publishing
      contents: read
    env:
      # First publish of a brand-new crate cannot use OIDC Trusted Publishing
      # (no crate yet = no trusted-publisher config to point at). Set a
      # CARGO_REGISTRY_TOKEN secret to bootstrap the first release; once the
      # crate exists, configure Trusted Publishing on crates.io and delete the
      # secret to fall back to tokenless OIDC.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Skip OIDC when a bootstrap token is present; otherwise mint a
      # short-lived token via Trusted Publishing (configured on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Release notes live in the repo (.github/release-notes/<version>.md) so a
      # deleted release is rebuildable and the tag alone yields populated notes.
      - name: Resolve release notes
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes file $NOTES - create it before tagging ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.NOTES_FILE }}
