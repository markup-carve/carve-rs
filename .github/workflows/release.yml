name: Release

# Dispatch with a version to approve the release before creating its tag.
# The published release body is a condensed summary checked against the tagged CHANGELOG section and footer.
# This workflow verifies the stored notes before publishing the crate or assets.
on:
  # Backfill: a release that predates the binaries job can be given its assets
  # without cutting a new version. Set version to start a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. 0.1.3)"
        required: false
        type: string

      version:
        description: New version to publish; leave empty when backfilling the tag input
        required: false
        type: string
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

  RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name || inputs.tag }}
  RELEASE_VERSION: ${{ inputs.version }}
# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  # THE GATE. No `environment:`, so it asks for no approval: it runs first, and
  # the `tag` job below needs it. Every check in here used to be a STEP of the
  # gated publish job, which GitHub holds BEFORE its first step - so the
  # reviewer was asked to approve a run that had measured nothing, and the
  # version check, the changelog gates and the packaging dry run then ran in
  # the same job that pushes the tag and publishes the crate.
  guard:
    name: The version, the changelog, the notes and the package all agree
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # OIDC for crates.io Trusted Publishing
      contents: read
    env:
      # First publish of a brand-new crate cannot use OIDC Trusted Publishing
      # (no crate yet = no trusted-publisher config to point at). Set a
      # CARGO_REGISTRY_TOKEN secret to bootstrap the first release; once the
      # crate exists, configure Trusted Publishing on crates.io and delete the
      # secret to fall back to tokenless OIDC.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          submodules: recursive
          # The completeness gate below walks every merge back to the previous
          # tag, so it needs the tags and the history behind them.
          fetch-depth: 0

      # Guard: the crate version AND the CHANGELOG must match the release tag,
      # so a mistyped tag, a forgotten version bump, or an un-cut changelog
      # cannot publish the wrong version.
      - name: Verify version and changelog match the release tag
        run: |
          TAG="$RELEASE_TAG"
          VER="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          # main reads X.Y.Z-dev between releases; only a cut version publishes.
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not a plain X.Y.Z version. A -dev or other prerelease version never publishes; cut the release first."
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section; cut it from [Unreleased] before releasing."
            exit 1
          fi

      # ...and the section describes ALL of it. The step above passes on a
      # section covering 3 of 24 merges, which is how the 0.1.7 section came to
      # document three changes out of twenty-four. Runs before anything
      # publishes, and names every missing pull request at once.
      - name: The changelog section accounts for every merge in this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check-changelog-completeness.py "$RELEASE_TAG"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: The release notes match this tag's changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/run-release-notes-gate.sh "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Skip OIDC when a bootstrap token is present; otherwise mint a
      # short-lived token via Trusted Publishing (configured on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'

      # `--locked`: publish the dependency set the tag was tested against,
      # rather than re-resolving at release time.
      - name: Verify the packaged crate before tagging
        run: cargo publish --dry-run --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

      # The tag does not exist yet. A crates.io version can never be yanked
      # back into availability under the same number, and the tag is what the
      # publish below packages, so a tag that is already on the remote means
      # this run is not the one that creates this version.
      - name: The tag does not exist yet, or already points at this commit
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
            [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::Existing tag $RELEASE_TAG points to another commit"; exit 1; }
          fi

  # THE TAG IS CREATED HERE, after the gate passes and after a human approves.
  # Pushing it is the first irreversible act of the release, so this is where
  # the approval belongs - and `needs: [guard]` is what makes the approval mean
  # something, because the reviewer is now looking at a green gate rather than
  # at a run that has not started working yet.
  #
  # This is also the ONLY job carrying `environment:`. GitHub prompts once per
  # gated job, so the second one this workflow used to carry asked twice for
  # one release (markup-carve/carve#2032).
  #
  # The publish runs in THIS run rather than on the new tag, because a ref
  # created with github.token triggers no other workflow.
  tag:
    name: Create the tag
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      # Re-checked under the approval: main can move while a run waits for a
      # reviewer, and the gate measured the commit that was current then.
      - name: The crate version still matches the release tag
        shell: bash
        run: |
          VER="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$RELEASE_TAG" != "$VER" ]; then
            echo "::error::Cargo.toml now declares $VER, not $RELEASE_TAG. The branch moved" \
                 "while this run waited for approval, so the gate result no longer describes" \
                 "it. Re-run the workflow."
            exit 1
          fi

      - name: Create the release tag after approval
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
            [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::Existing tag points to another commit"; exit 1; }
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  # Carries no `environment:`: `needs: [tag]` already makes it unreachable
  # without the approval, and a second gated job would ask the maintainer to
  # approve the same release twice.
  publish:
    name: Publish to crates.io
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # OIDC for crates.io Trusted Publishing
      contents: read
    env:
      # First publish of a brand-new crate cannot use OIDC Trusted Publishing
      # (no crate yet = no trusted-publisher config to point at). Set a
      # CARGO_REGISTRY_TOKEN secret to bootstrap the first release; once the
      # crate exists, configure Trusted Publishing on crates.io and delete the
      # secret to fall back to tokenless OIDC.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      # The tag the gate measured, rather than a branch: this is the tree the
      # crate is packaged from.
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A fresh mint: an OIDC token cannot cross a job boundary, so the one the
      # gate used for its dry run is not available here.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'

      # `--locked`: publish the dependency set the tag was tested against,
      # rather than re-resolving at release time.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  # ---------------------------------------------------------------------------
  # Prebuilt CLI binaries.
  #
  # `cargo install carve-lang` is the only install path today, which asks
  # everyone who wants to try the language to adopt a Rust toolchain first.
  # These assets are what a Homebrew formula, a Scoop manifest, a Dockerfile or
  # a plain `curl | tar` line can point at.
  #
  # New-release assets follow the protected crate publish.
  # Existing-release backfills use their own protected approval.
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # attach assets to the release
    env:
      # The workflow sets `-D warnings` for the crates.io publish. Deliberately
      # not inherited here: CI already fails a PR on a warning, and a lint that
      # fires on only one target must not be what stops that platform getting a
      # binary at release time.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            # Native ARM runner rather than a cross toolchain on x86: the
            # binary is what a Raspberry Pi or an ARM server installs, and a
            # native build needs no linker plumbing to get there.
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      # The tag is the release's for a published release, and the dispatch
      # input otherwise - so an existing release can be backfilled with assets
      # without cutting a new version.
      - name: Resolve the tag
        id: tag
        shell: bash
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Only a plain X.Y.Z release gets binaries
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not a plain X.Y.Z version. A -dev or other prerelease version never ships binaries."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # No submodules: the binary needs `src/` and `resources/`, and
          # `tests/spec` is 1200+ files this job never reads.

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The stored notes must match the tagged changelog before uploading assets.
      # Relative changelog links resolve against this tag in the release body.
      - name: The release notes match this tag's changelog
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/run-release-notes-gate.sh "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl needs its own libc toolchain; the GNU and MSVC targets are native.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        # The release profile carries `lto = "thin"` and `codegen-units = 1`
        # from Cargo.toml, so the shipped binary is the optimized one.
        #
        # `--locked`: every target in the matrix builds the dependency set in
        # Cargo.lock, so the six archives attached to one release are the same
        # program, and rebuilding a tag later reproduces what shipped.
        run: cargo build --locked --release --bin carve --target ${{ matrix.target }}

      # One archive per target, each carrying the licence and the README next to
      # the binary, so an extracted tarball is self-describing rather than a
      # bare executable of unknown provenance.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="carve-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/carve.exe" "dist/${NAME}/"
          else
            cp "target/${{ matrix.target }}/release/carve" "dist/${NAME}/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            ASSET="${NAME}.zip"
            7z a "${ASSET}" "${NAME}" > /dev/null
          else
            ASSET="${NAME}.tar.gz"
            tar -czf "${ASSET}" "${NAME}"
          fi
          # Checksums travel with the asset. A tap or a curl-installer needs the
          # digest, and asking it to re-download and hash the artifact to learn
          # the digest of that same download proves nothing.
          if command -v sha256sum > /dev/null; then
            sha256sum "${ASSET}" > "${ASSET}.sha256"
          else
            shasum -a 256 "${ASSET}" > "${ASSET}.sha256"
          fi
          echo "asset=dist/${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --repo "${{ github.repository }}" --clobber

    # `tag` is named as well as `publish`, so this job sits DOWNSTREAM of the
    # approval rather than beside it - it checks out `refs/tags/<tag>`, which
    # the tag job is what creates. `!cancelled()` is what lets the backfill
    # path through with `tag` and `publish` both skipped.
    needs:
      - tag
      - publish
      - backfill-gate
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs['backfill-gate'].result == 'success') }}

  # ---------------------------------------------------------------------------
  # Homebrew tap.
  #
  # The formula is GENERATED from the assets the job above just uploaded, and
  # the digests are read from the `.sha256` files published beside them rather
  # than recomputed here - so the formula pins the bytes the release actually
  # serves.
  #
  # Needs a token with write access to markup-carve/homebrew-carve, because
  # `github.token` is scoped to this repository. Without the secret the job
  # skips and says so; it never fails a release over a missing tap.
  homebrew:
    name: Update the Homebrew tap
    needs:
      - tag
      - binaries
      - publish-notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release or backfill approval has already completed.
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Is the tap token configured?
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.ok == 'true'
        with:
          repository: markup-carve/homebrew-carve
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render Formula/carve.rb
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG}"

          # Read each digest from the release's own .sha256 sidecar. `cut` takes
          # the hash off the front of the `<sha>  <filename>` line.
          sums="$(mktemp -d)"
          gh release download "${TAG}" --repo "${REPO}" \
            --pattern '*.tar.gz.sha256' --dir "${sums}"
          digest() {
            cut -d' ' -f1 "${sums}/carve-${TAG}-$1.tar.gz.sha256"
          }

          arm_mac="$(digest aarch64-apple-darwin)"
          x86_mac="$(digest x86_64-apple-darwin)"
          x86_linux="$(digest x86_64-unknown-linux-gnu)"
          arm_linux="$(digest aarch64-unknown-linux-gnu)"

          mkdir -p tap/Formula
          cat > tap/Formula/carve.rb <<RUBY
          # Generated by markup-carve/carve-rs .github/workflows/release.yml.
          # Edits here are overwritten on the next release.
          class Carve < Formula
            desc "Parser and renderer for the Carve markup language"
            homepage "https://markup-carve.github.io/carve/"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/carve-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_mac}"
              end
              on_intel do
                url "${base}/carve-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${x86_mac}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/carve-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${arm_linux}"
              end
              on_intel do
                url "${base}/carve-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${x86_linux}"
              end
            end

            def install
              bin.install "carve"
            end

            test do
              assert_match "<h1", pipe_output(bin/"carve", "# Hello\n")
            end
          end
          RUBY

      - name: Commit
        if: steps.gate.outputs.ok == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/carve.rb; then
            echo "::notice::Formula already matches ${{ steps.tag.outputs.tag }}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/carve.rb
          git commit -m "carve ${{ steps.tag.outputs.tag }}"
          git push
    if: ${{ !cancelled() && needs.binaries.result == 'success' && (needs['publish-notes'].result == 'success' ||
      github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.tag
      != '')) }}
  # Backfilling assets onto a release that is already public is maintenance,
  # not the release path: it uploads assets with `--clobber` and publishes no
  # version anywhere. It used to carry `environment: release` of its own, which
  # bought nothing - GitHub prompts once per gated JOB, so one release asked the
  # maintainer to approve twice - and the check it performs is kept here.
  #
  # `needs: [tag]` with `!cancelled()` rather than a bare `if:`: it places this
  # job on the far side of the approval on a release run, while still letting a
  # backfill run proceed with `tag` skipped.
  backfill-gate:
    name: Verify the existing-release asset backfill
    needs:
      - tag
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify the existing public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must be X.Y.Z"; exit 1; }
          [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ]
  publish-notes:
    name: Publish prepared release notes
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.binaries.result == 'success' && github.event_name
      == 'workflow_dispatch' && inputs.version != '' }}
    needs:
      - tag
      - publish
      - binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the prepared draft after packages and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate | jq -cs --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first | .id // empty')"
          [ -n "$id" ]
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH -f tag_name="$RELEASE_TAG" -F draft=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" | jq -e --arg tag "$RELEASE_TAG" '(.tag_name == $tag) and (.draft == false)'
