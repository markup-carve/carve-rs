name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test

      # `cargo test` already fails when a corpus category is missing from
      # IMPLEMENTED - that guard is why a spec bump lands red. This says whether
      # the missing ones are a LIST problem or an ENGINE problem, which is the
      # part a human otherwise has to work out by hand (carve#729):
      # a category whose pairs already render byte-exact is the first, and
      # `tools/sync-implemented.py` (no --check) adds exactly those.
      - name: Is the allowlist behind the corpus, or is the engine?
        if: always()
        run: |
          cargo build --release
          python3 tools/sync-implemented.py --check

  lints:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
