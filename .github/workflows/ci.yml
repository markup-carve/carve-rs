name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Performance work is intentionally split into exact-parity stacks. Run
    # the same gates while a child targets its `perf/*` parent; waiting for
    # every parent to merge would leave the widening commits untested.
    branches: [main, "perf/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # ~400 integration-test binaries dominate the test job via compile and
  # link time; line-tables-only keeps file:line in backtraces at a fraction
  # of the cost of full debug info.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  # OPTIMIZE THE CODE UNDER TEST. Measured on run 32074060975 with a warm
  # cache, `cargo build --all-targets` takes 40s and `cargo test` takes
  # 13m13s - so the job is paid in test EXECUTION, and execution runs the
  # parser and the renderers over ~1150 corpus documents plus several
  # generated sweeps. At opt-level 0 that is the slowest possible way to run
  # exactly the code this crate exists to run fast.
  #
  # BOTH keys are needed and neither is redundant: an integration test builds
  # the library as a DEPENDENCY, which takes profile.dev, while the test
  # binary itself takes profile.test. Setting only the second would leave
  # every corpus sweep calling an unoptimized parser.
  #
  # Set HERE rather than in Cargo.toml so a contributor's `cargo build` stays
  # as fast as it is today - this is a CI trade (more compile, much less
  # execution), not a repo-wide one.
  #
  # opt-level 2 rather than 3: 3 buys little on this shape and costs compile
  # time, which is the side of the trade being spent. debug-assertions stay
  # ON at both levels, so nothing stops being checked.
  CARGO_PROFILE_DEV_OPT_LEVEL: "2"
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"

jobs:
  # THE PIN RESOLVES BY SHA, SO NOTHING ELSE HERE CAN SEE A DANGLING ONE. Every
  # other job checks the spec submodule out and runs against whatever tree the
  # pin names, which works just as well for a commit that is not on spec `main`
  # as for one that is - right up until the commit is collected and the checkout
  # itself starts failing (markup-carve/carve#1740). Seconds, and it needs no
  # toolchain, so it does not wait behind the build.
  spec-pin:
    name: Spec pin is on spec main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # The checkout above is shallow (no fetch-depth), so the script deepens
      # the submodule before asking - see the comment in it for why a depth-1
      # clone cannot answer the ancestry question either way.
      - run: ./scripts/check-spec-pin-ancestry.sh tests/spec

  test:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs RUN THE SUITE ON STABLE ONLY; the MSRV leg runs the suite on
        # pushes to main. What a pull request gets instead is the `msrv` job
        # below, which compiles against 1.75 without running ~4500 tests a
        # second time - so a pull request that breaks the floor is caught
        # before merge without doubling the expensive half of this job.
        toolchain: ${{ github.event_name == 'push' && fromJSON('["stable", "1.75"]') || fromJSON('["stable"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --locked --all-targets
      # WHY NEXTEST: the test step is ~13 minutes against a ~40 second warm
      # build, so what costs time here is RUNNING the tests, not compiling
      # them. Cargo runs test TARGETS one after another, and this crate has
      # ~400 of them holding ~3700 test functions - so the runner alternates
      # between a short burst of parallelism inside one binary and a
      # serialization point, ~400 times. Nextest schedules every test from
      # every binary through ONE queue instead, which is the case this crate
      # is close to the worst shape for under cargo's scheduler.
      #
      # It also reports per-test timings, which is the part that makes the
      # next change to this file measurable rather than guessed.
      # THE TIMING SUITE RUNS ALONE, and it has to be told to.
      #
      # `tests/perf_regressions.rs` measures wall clock, and carve-rs#523 fixed
      # its flake with a `static PERF_LOCK` mutex that serializes its 34 timing
      # tests against each other. That lock works because `cargo test` runs the
      # tests of one binary as THREADS in one process.
      #
      # Nextest runs every test in its OWN PROCESS. A static mutex cannot be
      # contended across processes, so the switch above silently turned that
      # lock into a check that cannot fire: the timing tests went back to
      # competing, now against all ~3900 tests rather than only each other.
      # `a_quoted_run_of_unclosed_braces_is_scanned_once` reported 1.79x - its
      # documented regression signature - on runs with no source change, and
      # main went red intermittently on commits that touch no engine code.
      #
      # So the isolation the lock used to provide comes from the RUNNER now:
      # everything else first, then the timing suite by itself, single-threaded.
      # Splitting the run costs one extra process launch and keeps the whole
      # point of nextest for the other ~3900 tests.
      #
      # `--no-fail-fast` ON BOTH, because nextest's default is fail-fast and a
      # suite that stops at the first failure cannot say how big a breakage is.
      # Measured on a red main (carve-rs#1285): the run died at test 13 of 4500
      # and reported nothing about the other 4487, while the same commit with
      # `--no-fail-fast` gave `4500 run, 4497 passed, 3 failed` - two failures
      # CI had never shown anyone, one of which nothing was tracking at all.
      #
      # Two costs, and only the second is about wall clock. While main is red
      # CI VERIFIES NOTHING FOR ANYONE: every pull request reports the same
      # first failure, so a contributor cannot tell whether their own change is
      # sound. And "one test failed" and "three tests failed" look identical, so
      # the size of a breakage is invisible until someone runs the suite by hand
      # - which is worst exactly at a corpus bump, when several things move at
      # once.
      #
      # UNCONDITIONAL RATHER THAN PER-EVENT. Fail-fast on pull requests and
      # `--no-fail-fast` on main would keep a red main honest and cost nothing on
      # a green PR, but it does not answer the first cost above, which is a
      # PULL-REQUEST problem: the contributor who cannot read their own result is
      # on a PR, and that is the case the split leaves broken. It also makes the
      # command differ between the run that gates a merge and the run that
      # reports main, so a failure could be reported differently depending on
      # where it appeared. Every other engine in the org already reports its full
      # failure set - carve-js (vitest), carve-php (paratest), carve-go
      # (`go test ./...`), carve-rb (minitest) and carve-py (pytest) all run the
      # whole suite - so this was the outlier rather than the house style.
      #
      # The price is wall clock on a RED suite only; a green suite runs exactly
      # as long as it did, because there is no first failure to stop at.
      - run: cargo nextest run -E 'not binary(perf_regressions)' --no-fail-fast
      - run: cargo nextest run -E 'binary(perf_regressions)' --test-threads 1 --no-fail-fast
      # NEXTEST DOES NOT RUN DOCTESTS, by design - they need a compiler
      # invocation per test rather than a binary to schedule. This crate has
      # doctests (`src/extensions/*` carry worked examples), so dropping this
      # line would silently stop testing them while the job stayed green.
      - run: cargo test --doc

      # The test run already fails when a corpus category is missing from
      # IMPLEMENTED - that guard is why a spec bump lands red. This says whether
      # the missing ones are a LIST problem or an ENGINE problem, which is the
      # part a human otherwise has to work out by hand (carve#729):
      # a category whose pairs already render byte-exact is the first, and
      # `tools/sync-implemented.py` (no --check) adds exactly those.
      - name: Is the allowlist behind the corpus, or is the engine?
        if: always()
        # The tool prefers target/release/carve and falls back to the debug
        # binary the build step just produced. A restored cache may still hold
        # a STALE release binary from an older commit, so drop it rather than
        # paying for a second, release-profile compile of the whole crate.
        run: |
          rm -rf target/release
          python3 tools/sync-implemented.py --check

  # DOES THE FLOOR STILL COMPILE? Asked on every pull request, unlike the
  # `test` matrix above, and cheap enough to be: compiling against 1.75 is a
  # fraction of running the suite against it.
  #
  # The case this exists for is a DEPENDENCY BUMP. `rust-version = "1.75"`
  # binds this crate, not the tree beneath it, so a transitive dependency can
  # raise its own minimum in a semver-compatible release and take the floor
  # with it. Dependabot opens exactly those pull requests (see
  # .github/dependabot.yml), and without this job every one of them would go
  # green on stable and turn main red on merge - which is the failure mode
  # committing Cargo.lock was meant to close off, arriving through the other
  # door.
  #
  # `--all-targets` because the dev-dependencies are on the floor too, and
  # `--locked` because the lock file is the thing under test here.
  msrv:
    name: Compiles on the MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `tests/source_layout.rs` reaches into the submodule with
          # `include_str!`, so the corpus has to be on disk for a CHECK too,
          # not only for a run.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  lints:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
