name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # ~340 integration-test binaries dominate the test job via compile and
  # link time; line-tables-only keeps file:line in backtraces at a fraction
  # of the cost of full debug info.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  test:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run stable only; the MSRV leg runs on pushes to main, so a
        # 1.75 regression is still caught on merge without doubling every
        # PR's CI time.
        toolchain: ${{ github.event_name == 'push' && fromJSON('["stable", "1.75"]') || fromJSON('["stable"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --all-targets
      # WHY NEXTEST: the test step is ~13 minutes against a ~40 second warm
      # build, so what costs time here is RUNNING the tests, not compiling
      # them. Cargo runs test TARGETS one after another, and this crate has
      # ~400 of them holding ~3700 test functions - so the runner alternates
      # between a short burst of parallelism inside one binary and a
      # serialization point, ~400 times. Nextest schedules every test from
      # every binary through ONE queue instead, which is the case this crate
      # is close to the worst shape for under cargo's scheduler.
      #
      # It also reports per-test timings, which is the part that makes the
      # next change to this file measurable rather than guessed.
      - run: cargo nextest run
      # NEXTEST DOES NOT RUN DOCTESTS, by design - they need a compiler
      # invocation per test rather than a binary to schedule. This crate has
      # doctests (`src/extensions/*` carry worked examples), so dropping this
      # line would silently stop testing them while the job stayed green.
      - run: cargo test --doc

      # The test run already fails when a corpus category is missing from
      # IMPLEMENTED - that guard is why a spec bump lands red. This says whether
      # the missing ones are a LIST problem or an ENGINE problem, which is the
      # part a human otherwise has to work out by hand (carve#729):
      # a category whose pairs already render byte-exact is the first, and
      # `tools/sync-implemented.py` (no --check) adds exactly those.
      - name: Is the allowlist behind the corpus, or is the engine?
        if: always()
        # The tool prefers target/release/carve and falls back to the debug
        # binary the build step just produced. A restored cache may still hold
        # a STALE release binary from an older commit, so drop it rather than
        # paying for a second, release-profile compile of the whole crate.
        run: |
          rm -rf target/release
          python3 tools/sync-implemented.py --check

  lints:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
