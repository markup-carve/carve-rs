# Dependency drift, now that Cargo.lock is pinned.
#
# Every CI and release step passes `--locked`, so the lock file is what gets
# built - which also means CI stops seeing a dependency's newly published,
# semver-compatible versions until somebody updates the lock. This is what
# updates it: one pull request per bump, gated by the same suite as any other
# change, rather than a `cargo update` nobody has a reason to run.
#
# UNGROUPED BY DEFAULT, with one exception below. A bump that needs real work
# rather than a merge should fail on its own rather than take every other bump
# down with it, which is what a single catch-all group would do.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # html5ever AND ITS DOM SINK CANNOT MOVE SEPARATELY. markup5ever_rcdom
      # depends on the exact html5ever it was cut against, so a pull request
      # bumping one of them cannot resolve, cannot build, and cannot be fixed
      # by a maintainer without pulling in the other. Ungrouped, that is not a
      # red PR someone has to decide about - it is two red PRs that are red BY
      # CONSTRUCTION and can never go green, which is how a bot teaches people
      # to ignore it. Measured: carve-rs#1471 and carve-rs#1472 both failed
      # every gate within a minute of being opened.
      #
      # Deliberately narrow. This groups a package with the package it is
      # inseparable from, and nothing else.
      html5ever:
        patterns:
          - html5ever
          - markup5ever*
          - xml5ever
