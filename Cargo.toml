[package]
# Published crate name (`carve` is taken on crates.io). The library is still
# imported as `carve` (see [lib].name) and the CLI binary is still `carve`.
name = "carve-lang"
version = "0.1.13"
edition = "2021"
rust-version = "1.75"
description = "Rust parser and HTML renderer for the Carve markup language."
license = "MIT"
repository = "https://github.com/markup-carve/carve-rs"
homepage = "https://markup-carve.github.io/carve/"
documentation = "https://docs.rs/carve-lang"
readme = "README.md"
keywords = ["carve", "markup", "parser", "html", "djot"]
categories = ["parser-implementations", "text-processing"]
# Integration tests are declared below, not discovered (tests/suite/main.rs).
autotests = false
# Ship only the crate sources + metadata. The integration tests pull in the
# `tests/spec` submodule (1200+ corpus/doc files) which consumers do not need.
include = ["/src/**/*", "/resources/**/*", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
# The filesystem resolver, ON by default. Off, the crate carries no code that
# opens a file: a sandboxed, WASM or browser-hosted build can DROP it rather
# than rely on the target having no filesystem to make it fail. carve-js states
# the same property at its module boundary (the resolver is behind a `./node`
# subpath, absent from the browser bundle); this is the Rust spelling of it.
#
# Nothing else in the crate reads a file, so `--no-default-features` is the
# whole guarantee, and `tests/no_filesystem_without_the_fs_feature.rs` is what
# keeps it true.
default = ["fs"]
fs = []
experimental-event-parser = []
experimental-event-parser-options = ["experimental-event-parser"]

[dependencies]
# THESE TWO MOVE TOGETHER OR NOT AT ALL. markup5ever_rcdom is the DOM sink
# html5ever parses into, and it depends on the exact html5ever it was cut
# against, so a bump to one alone cannot resolve. Dependabot opens them as
# separate pull requests (carve-rs#1471, carve-rs#1472) and each of those fails
# on its own by construction - the pair has to land in one commit.
#
# The rcdom version reads 0.39.0+unofficial on crates.io. The `+unofficial`
# is BUILD METADATA, which a version requirement ignores, so `"0.39"` matches
# it. Spelling it `0.39.0-unofficial` would ask for a PRE-RELEASE instead,
# which is a different version space and not what is published.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
memchr = "2.7"
smallvec = "1.15"
# The Markdown importer parses to an AST first, the way the HTML importer uses
# html5ever, rather than rewriting source lines. pulldown-cmark is the
# ecosystem's CommonMark parser and emits an event stream that walks straight
# into a Carve Document.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-normalization = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# `unbounded_depth` because the corpus holds a document nested to the parser's
# cap (200 containers), and this crate's own AST JSON is then past serde_json's
# default 128-level limit. `parse_value` bounds the depth itself, before serde
# recurses, so lifting serde's own limit does not lift the budget.
serde_json = { version = "1", features = ["unbounded_depth"] }

[dev-dependencies]

