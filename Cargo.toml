[package]
# Published crate name (`carve` is taken on crates.io). The library is still
# imported as `carve` (see [lib].name) and the CLI binary is still `carve`.
name = "carve-lang"
version = "0.1.14"
edition = "2024"
rust-version = "1.88"
description = "Rust parser, HTML renderer and tooling for the Carve markup language."
license = "MIT"
repository = "https://github.com/markup-carve/carve-rs"
homepage = "https://markup-carve.github.io/carve/"
documentation = "https://docs.rs/carve-lang"
readme = "README.md"
keywords = ["carve", "markup", "parser", "html"]
categories = ["parser-implementations", "text-processing"]
# build.rs generates the tables from spec-data/; the tests and their fixtures
# stay out of the package.
include = ["/src/**/*", "/cli/**/*", "/build.rs", "/spec-data/**/*", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
# The filesystem resolver, ON by default. Off, the library carries no code that
# opens a file, so a sandboxed, WASM or browser-hosted build can drop it.
# `tests/the_library_opens_no_file_without_the_fs_feature.rs` keeps it true.
default = ["fs"]
fs = []
# Stage hooks for the timing program in bench/; off in every normal build.
profile = []

[dependencies]
bumpalo = "3"
# Markdown and GFM (cmark-gfm port) and Djot for the import hub (carve-js#5074).
comrak = { version = "=0.55.0", default-features = false }
jotdown = "0.10"
# The two move together: markup5ever_rcdom is cut against this exact html5ever.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
regex = "1"
# Already in the tree through regex; data lint reads pattern structure from it (C2-W-142).
regex-syntax = "0.8"
typed-arena = "2"
unicode-normalization = "0.1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
# The fixture trees nest past serde_json's default recursion limit of 128.
serde_json = { version = "1", features = ["unbounded_depth"] }
flate2 = "1"

[lib]
name = "carve"
path = "src/lib.rs"

[[bin]]
name = "carve"
path = "src/main.rs"
required-features = ["fs"]

[profile.release]
lto = "thin"
codegen-units = 1

# Full debug info makes every test binary carry a copy of it.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
