[package]
# Published crate name (`carve` is taken on crates.io). The library is still
# imported as `carve` (see [lib].name) and the CLI binary is still `carve`.
name = "carve-lang"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reference Rust parser and HTML renderer for the Carve markup language."
license = "MIT"
repository = "https://github.com/markup-carve/carve-rs"
homepage = "https://markup-carve.github.io/carve/"
documentation = "https://docs.rs/carve-lang"
readme = "README.md"
keywords = ["carve", "markup", "parser", "html", "djot"]
categories = ["parser-implementations", "text-processing"]
# Ship only the crate sources + metadata. The integration tests pull in the
# `tests/spec` submodule (1200+ corpus/doc files) which consumers do not need.
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
name = "carve"
path = "src/lib.rs"

[[bin]]
name = "carve"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
